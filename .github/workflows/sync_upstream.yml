name: Sync upstream and customize description

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out fork
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: main
      - name: Validate trusted description patch
        run: python3 -B .github/custom_sync/test_sync.py
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/eze-is/web-access.git
          git fetch --no-tags upstream main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Merge upstream and reapply customization
        run: python3 -B .github/custom_sync/sync.py
      - name: Verify and publish
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add --all
          if git diff --cached --quiet && ! test -f .git/MERGE_HEAD; then
            echo 'No upstream changes; repository already up to date.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          upstream_sha=$(git rev-parse --short refs/remotes/upstream/main)
          git commit -m "chore: sync upstream ${upstream_sha} and retain custom description"
          git push origin HEAD:main
          echo "Synced upstream ${upstream_sha}; custom description retained." >> "$GITHUB_STEP_SUMMARY"
